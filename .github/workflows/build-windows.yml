name: Build Windows exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build (portable exe + zip)
        run: npx electron-builder --win portable zip --x64 --publish never
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/*.exe
            dist/*.zip
      - name: Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          body: |
            윈도우 전시용 실행파일.
            - `*-portable.exe`: 설치 없이 더블클릭 → 전체화면 전시 시작 (첫 실행은 압축 해제로 몇 초 걸림)
            - `*-win-x64.zip`: 압축을 풀고 폴더 안의 `대칭으로보는당구.exe` 실행 (매번 즉시 시작)
            종료: 홈 버튼(또는 로고) 3초 길게 누르기 → ⏻ 전시 종료
