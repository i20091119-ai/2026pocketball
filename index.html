<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10161c">
<title>대칭으로 보는 당구 — 2026 포켓볼</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">

  <!-- 홈 -->
  <section class="screen" id="screen-home">
    <div class="home-inner">
      <p class="eyebrow">경남수학문화관 체험교구</p>
      <h1>대칭으로 보는 당구</h1>
      <div class="menu">
        <button class="card" data-go="rect"><span class="icon">▭</span><b>네모 당구대 미션</b><small>거울처럼 튀는 공, 대칭으로 맞혀요</small></button>
        <button class="card" data-go="ellipse"><span class="icon">⬭</span><b>타원 당구대 마법</b><small>마법의 점에서 치면 무조건 맞아요</small></button>
        <button class="card" data-go="pocket"><span class="icon">🎱</span><b>포켓볼 대결</b><small>친구와 번갈아 치는 포켓볼</small></button>
      </div>
      <button id="btn-sound" class="ghost">🔊 소리 켜짐</button>
    </div>
  </section>

  <!-- 네모 당구대 -->
  <section class="screen" id="screen-rect">
    <header class="bar top">
      <button class="home-btn" data-go="home">⌂ 홈</button>
      <div class="msg"></div>
    </header>
    <footer class="bar bottom">
      <div class="tabs" id="rect-tabs">
        <button data-level="1">☆ 1쿠션</button>
        <button data-level="2">☆ 2쿠션</button>
        <button data-level="3">☆ 3쿠션</button>
        <button data-level="predict">🎯 예측 놀이</button>
      </div>
      <div class="actions">
        <button id="rect-mirror">🪞 거울 켜기</button>
        <button id="rect-shuffle">🔀 공 섞기</button>
        <button id="rect-replay">🐢 다시 보기</button>
        <button id="rect-fire" class="primary" hidden>🚀 발사!</button>
        <button id="rect-reaim" hidden>↩ 방향 다시</button>
      </div>
    </footer>
  </section>

  <!-- 타원 당구대 -->
  <section class="screen" id="screen-ellipse">
    <header class="bar top">
      <button class="home-btn" data-go="home">⌂ 홈</button>
      <div class="msg"></div>
    </header>
    <footer class="bar bottom">
      <div class="actions">
        <button id="ellipse-reset">🎯 공 제자리로</button>
        <button id="ellipse-rays">✨ 불꽃놀이</button>
        <button id="ellipse-replay">🐢 다시 보기</button>
        <label class="slider">○ 동그라미 <input type="range" id="ellipse-shape" min="45" max="96" value="60"> 납작하게 ⬭</label>
      </div>
      <div class="bars" id="ellipse-bars"></div>
    </footer>
  </section>

  <!-- 포켓볼 대결 -->
  <section class="screen" id="screen-pocket">
    <header class="bar top">
      <button class="home-btn" data-go="home">⌂ 홈</button>
      <div class="turn p1" id="pocket-turn"></div>
      <div class="msg"></div>
      <div class="score" id="pocket-score"></div>
      <div class="timer" id="pocket-timer"></div>
    </header>
    <footer class="bar bottom">
      <div class="actions">
        <button id="pocket-aimline" class="on">🎯 조준선 켜짐</button>
        <button id="pocket-mirror">🪞 거울 켜기</button>
        <button id="pocket-new">🔄 새 게임</button>
      </div>
    </footer>
    <div class="modal" id="pocket-setup">
      <div class="box">
        <h2>🎱 포켓볼 대결</h2>
        <div class="opt-row seg" data-opt="mode"><span class="label">어떤 규칙으로?</span>
          <button class="on" data-v="score">점수 모드 — 아무 공이나 넣으면 1점</button>
          <button data-v="eight">8볼 모드 — 단색/줄무늬 나눠서</button>
        </div>
        <div class="opt-row seg" data-opt="balls"><span class="label">공 개수</span>
          <button class="on" data-v="15">15개</button><button data-v="9">9개 (빠른 게임)</button>
        </div>
        <div class="opt-row seg" data-opt="turnSec"><span class="label">한 번 칠 때 시간 제한</span>
          <button class="on" data-v="0">없음</button><button data-v="30">30초</button>
        </div>
        <div class="opt-row seg" data-opt="gameSec"><span class="label">게임 시간 제한</span>
          <button class="on" data-v="0">없음</button><button data-v="300">5분</button>
        </div>
        <div class="opt-row seg" data-opt="first"><span class="label">누가 먼저? (가위바위보로 정해요 ✊✌️✋)</span>
          <button class="on p1" data-v="0">🔵 1번 친구</button><button class="p2" data-v="1">🔴 2번 친구</button>
        </div>
        <button id="pocket-start" class="primary big">시작!</button>
      </div>
    </div>
    <div class="modal" id="pocket-over">
      <div class="box">
        <h2 id="pocket-over-text"></h2>
        <div class="opt-row">
          <button id="pocket-again" class="primary big">🔄 다시 하기</button>
          <button class="big" data-go="home">⌂ 홈으로</button>
        </div>
      </div>
    </div>
  </section>

</div>
<script src="js/physics.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
<script src="js/mode-rect.js"></script>
<script src="js/mode-ellipse.js"></script>
<script src="js/mode-pocket.js"></script>
<script>
  Object.values(App.modes).forEach(m => m.init());
  App.start();
</script>
</body>
</html>
